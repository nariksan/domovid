<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ДОМОВИД - Мессенджер</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0b141a;color:#e9edef;height:100vh;overflow:hidden}
.maintenance{display:none;position:fixed;inset:0;background:#0b141a;z-index:9999;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.maintenance.active{display:flex}
.maintenance h1{font-size:64px}
.maintenance h2{color:#f5c542;margin:12px}
.maintenance p{color:#8696a0;margin-bottom:24px}
.maintenance a{color:#00a884;text-decoration:none;padding:10px 20px;background:#202c33;border-radius:8px}
.app{display:flex;height:100vh}
.sidebar{width:360px;background:#111b21;border-right:1px solid #2a3942;display:flex;flex-direction:column}
.sidebar-header{padding:12px 16px;background:#202c33;display:flex;align-items:center;justify-content:space-between}
.sidebar-header a{color:#00a884;text-decoration:none}
.chat-list{flex:1;overflow-y:auto}
.chat-item{padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;border-bottom:1px solid #2a3942}
.chat-item:hover,.chat-item.active{background:#2a3942}
.chat-icon{width:48px;height:48px;border-radius:50%;background:#2a3942;display:flex;align-items:center;justify-content:center;font-size:24px}
.chat-info{flex:1}
.chat-name{font-size:16px;font-weight:500}
.chat-preview{font-size:13px;color:#8696a0;margin-top:2px}
.chat-window{flex:1;display:flex;flex-direction:column}
.chat-head{padding:12px 16px;background:#202c33;border-bottom:1px solid #2a3942;display:flex;align-items:center;gap:12px}
.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:70%;padding:8px 12px;border-radius:8px}
.msg.me{background:#005c4b;align-self:flex-end}
.msg.other{background:#202c33;align-self:flex-start}
.msg .time{font-size:10px;color:#8696a0;margin-top:4px;text-align:right}
.input-bar{padding:12px 16px;background:#202c33;display:flex;gap:8px}
.input-bar input{flex:1;background:#2a3942;border:none;color:#e9edef;padding:12px;border-radius:20px}
.input-bar button{background:#00a884;color:#fff;border:none;width:46px;height:46px;border-radius:50%;cursor:pointer}
.no-chat{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#8696a0}
</style>
</head>
<body>

<div class="maintenance" id="maintenance">
  <h1>🔧</h1>
  <h2>Мессенджер на тех. работах</h2>
  <p>Владелец временно отключил мессенджер</p>
  <a href="index.html">← Вернуться на сайт</a>
</div>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <a href="index.html">← На сайт</a>
      <h2>💬 Чаты</h2>
      <button id="btnNew" style="display:none;background:#00a884;color:#fff;border:none;padding:8px 14px;border-radius:8px;cursor:pointer" onclick="alert('Создайте чат в разделе Владелец на index.html')">➕</button>
    </div>
    <div class="chat-list" id="chatList"></div>
  </aside>

  <main class="chat-window">
    <div class="no-chat" id="noChat">
      <div style="font-size:80px">💬</div>
      <h3>Выберите чат</h3>
      <p>Выберите чат из списка слева</p>
    </div>
    <div id="activeChat" style="display:none;flex:1;flex-direction:column;height:100%">
      <div class="chat-head">
        <div class="chat-icon" id="activeIcon">💬</div>
        <h3 id="activeName">—</h3>
      </div>
      <div class="messages" id="messages"></div>
      <div class="input-bar">
        <input type="text" id="msgInput" placeholder="Введите сообщение...">
        <button id="btnSend">➤</button>
      </div>
    </div>
  </main>
</div>

<script>
const LS={user:'currentUser',users:'employees',branches:'branches',chats:'chats',enabled:'messengerEnabled'};
let currentUser=null,chats=[],activeChatId=null;

function init(){
  const saved=localStorage.getItem(LS.user);
  if(!saved){window.location.href='index.html';return;}
  currentUser=JSON.parse(saved);
  
  const enabled=localStorage.getItem(LS.enabled);
  if(enabled==='false'){document.getElementById('maintenance').classList.add('active');return;}
  
  loadChats();
  setInterval(loadChats,2000);
  
  document.getElementById('btnSend').addEventListener('click',sendMessage);
  document.getElementById('msgInput').addEventListener('keypress',e=>{if(e.key==='Enter')sendMessage()});
}

function loadChats(){
  chats=JSON.parse(localStorage.getItem(LS.chats)||'[]');
  const visible=chats.filter(c=>{
    if(c.type==='global')return true;
    if(c.type==='branch')return c.branchId===currentUser.branchId;
    if(c.type==='manual'){if(['owner','admin','helper'].includes(currentUser.role))return true;return c.members&&c.members.includes(currentUser.id);}
    return false;
  });
  
  const list=document.getElementById('chatList');
  if(visible.length===0){list.innerHTML='<div class="chat-item"><div class="chat-info"><div class="chat-name">Нет чатов</div></div></div>';return;}
  
  list.innerHTML=visible.map(c=>{
    const icon=c.type==='global'?'🌐':c.type==='branch'?'🏪':'';
    const last=c.messages&&c.messages[c.messages.length-1];
    return `<div class="chat-item ${c.id===activeChatId?'active':''}" data-id="${c.id}"><div class="chat-icon">${icon}</div><div class="chat-info"><div class="chat-name">${c.name}</div><div class="chat-preview">${last?last.text.substring(0,40):'Нет сообщений'}</div></div></div>`;
  }).join('');
  
  list.querySelectorAll('.chat-item').forEach(el=>{el.addEventListener('click',()=>openChat(el.dataset.id))});
}

function openChat(id){
  activeChatId=id;
  document.getElementById('noChat').style.display='none';
  document.getElementById('activeChat').style.display='flex';
  const c=chats.find(x=>x.id===id);
  document.getElementById('activeName').textContent=c.name;
  document.getElementById('activeIcon').textContent=c.type==='global'?'🌐':c.type==='branch'?'🏪':'';
  renderMessages();
  loadChats();
}

function renderMessages(){
  const c=chats.find(x=>x.id===activeChatId);
  const box=document.getElementById('messages');
  if(!c||!c.messages||c.messages.length===0){box.innerHTML='<div style="text-align:center;color:#8696a0;padding:20px">Нет сообщений</div>';return;}
  box.innerHTML=c.messages.map(m=>{
    const me=m.authorId===currentUser.id;
    return `<div class="msg ${me?'me':'other'}"><div>${m.text}</div><div class="time">${new Date(m.timestamp).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</div></div>`;
  }).join('');
  box.scrollTop=box.scrollHeight;
}

function sendMessage(){
  const input=document.getElementById('msgInput');
  const text=input.value.trim();
  if(!text||!activeChatId)return;
  const c=chats.find(x=>x.id===activeChatId);
  if(!c.messages)c.messages=[];
  c.messages.push({id:'m_'+Date.now(),authorId:currentUser.id,authorName:currentUser.name,text:text,timestamp:Date.now()});
  localStorage.setItem(LS.chats,JSON.stringify(chats));
  input.value='';
  renderMessages();
  loadChats();
}

document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
