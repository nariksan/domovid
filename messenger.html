<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ДОМОВИД - Мессенджер</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0b141a;color:#e9edef;height:100vh;overflow:hidden}
.maintenance{display:none;position:fixed;inset:0;background:#0b141a;z-index:9999;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.maintenance.active{display:flex}
.maintenance h1{font-size:64px;margin-bottom:16px}
.maintenance h2{color:#f5c542;margin-bottom:12px}
.maintenance p{color:#8696a0;margin-bottom:24px}
.maintenance a{color:#00a884;text-decoration:none;padding:10px 20px;background:#202c33;border-radius:8px}
.app{display:flex;height:100vh}
.sidebar{width:360px;background:#111b21;border-right:1px solid #2a3942;display:flex;flex-direction:column}
.sidebar-header{padding:12px 16px;background:#202c33;display:flex;align-items:center;justify-content:space-between}
.sidebar-header a{color:#00a884;text-decoration:none;font-size:14px}
.sidebar-header h2{font-size:16px}
.btn-new{background:#00a884;color:#fff;border:none;padding:8px 14px;border-radius:8px;cursor:pointer}
.chat-list{flex:1;overflow-y:auto}
.chat-item{padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;border-bottom:1px solid #2a3942}
.chat-item:hover,.chat-item.active{background:#2a3942}
.chat-icon{width:48px;height:48px;border-radius:50%;background:#2a3942;display:flex;align-items:center;justify-content:center;font-size:24px}
.chat-info{flex:1}
.chat-name{font-size:16px;font-weight:500}
.chat-preview{font-size:13px;color:#8696a0;margin-top:2px}
.chat-window{flex:1;display:flex;flex-direction:column}
.chat-head{padding:12px 16px;background:#202c33;border-bottom:1px solid #2a3942;display:flex;align-items:center;gap:12px}
.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:70%;padding:8px 12px;border-radius:8px}
.msg.me{background:#005c4b;align-self:flex-end}
.msg.other{background:#202c33;align-self:flex-start}
.msg .author{font-size:12px;color:#06cf9c;font-weight:600;margin-bottom:2px}
.msg .time{font-size:10px;color:#8696a0;margin-top:4px;text-align:right}
.input-bar{padding:12px 16px;background:#202c33;display:flex;gap:8px}
.input-bar input{flex:1;background:#2a3942;border:none;color:#e9edef;padding:12px;border-radius:20px}
.input-bar button{background:#00a884;color:#fff;border:none;width:46px;height:46px;border-radius:50%;cursor:pointer}
.no-chat{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#8696a0;gap:16px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center}
.modal.active{display:flex}
.modal-content{background:#202c33;border-radius:12px;padding:24px;width:90%;max-width:500px}
.modal-content h3{margin-bottom:20px}
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:6px;color:#8696a0;font-size:13px}
.form-group input,.form-group select{width:100%;background:#2a3942;border:none;color:#e9edef;padding:10px;border-radius:6px}
.members-list{max-height:200px;overflow-y:auto;background:#2a3942;border-radius:6px;padding:8px}
.members-list label{display:flex;align-items:center;gap:8px;padding:6px;cursor:pointer}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.modal-actions button{padding:10px 16px;border:none;border-radius:6px;cursor:pointer}
.btn-primary{background:#00a884;color:#fff}
.btn-secondary{background:#2a3942;color:#e9edef}
</style>
</head>
<body>

<div class="maintenance" id="maintenance">
  <h1></h1>
  <h2>Мессенджер на тех. работах</h2>
  <p>Владелец временно отключил мессенджер</p>
  <a href="index.html">← Вернуться на сайт</a>
</div>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <a href="index.html">← На сайт</a>
      <h2>💬 Чаты</h2>
      <button class="btn-new" id="btnNew" style="display:none">➕ Новый</button>
    </div>
    <div class="chat-list" id="chatList">
      <div class="chat-item"><div class="chat-info"><div class="chat-name">Загрузка...</div></div></div>
    </div>
  </aside>

  <main class="chat-window">
    <div class="no-chat" id="noChat">
      <div style="font-size:80px">💬</div>
      <h3>Выберите чат</h3>
      <p>Выберите чат из списка слева</p>
    </div>
    <div id="activeChat" style="display:none;flex:1;flex-direction:column;height:100%">
      <div class="chat-head">
        <div class="chat-icon" id="activeIcon">💬</div>
        <h3 id="activeName">—</h3>
      </div>
      <div class="messages" id="messages"></div>
      <div class="input-bar">
        <input type="text" id="msgInput" placeholder="Введите сообщение...">
        <button id="btnSend">➤</button>
      </div>
    </div>
  </main>
</div>

<div class="modal" id="newChatModal">
  <div class="modal-content">
    <h3> Новый чат</h3>
    <div class="form-group">
      <label>Тип чата</label>
      <select id="chatType">
        <option value="manual"> Чат вручную</option>
        <option value="branch">🏪 Чат подразделения</option>
        <option value="global">🌐 Общий чат сети</option>
      </select>
    </div>
    <div class="form-group">
      <label>Название</label>
      <input type="text" id="chatName" placeholder="Название чата">
    </div>
    <div class="form-group" id="branchBlock" style="display:none">
      <label>Отделение</label>
      <select id="chatBranch"></select>
    </div>
    <div class="form-group" id="membersBlock">
      <label>Участники</label>
      <div class="members-list" id="membersList"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Отмена</button>
      <button class="btn-primary" onclick="createChat()">Создать</button>
    </div>
  </div>
</div>

<script>
const LS = {
  user: 'currentUser',
  users: 'employees',
  branches: 'branches',
  chats: 'chats',
  enabled: 'messengerEnabled'
};

let currentUser = null;
let allUsers = [];
let allBranches = [];
let chats = [];
let activeChatId = null;

function init() {
  const saved = localStorage.getItem(LS.user);
  if (!saved) {
    window.location.href = 'index.html';
    return;
  }

  currentUser = JSON.parse(saved);

  const enabled = localStorage.getItem(LS.enabled);
  if (enabled === 'false') {
    document.getElementById('maintenance').classList.add('active');
    return;
  }

  loadData();

  if (['owner','admin','helper'].includes(currentUser.role)) {
    document.getElementById('btnNew').style.display = 'inline-block';
  }

  renderChatList();
  setInterval(() => { loadData(); renderChatList(); if (activeChatId) renderMessages(); }, 2000);

  document.getElementById('btnNew').addEventListener('click', openModal);
  document.getElementById('btnSend').addEventListener('click', sendMessage);
  document.getElementById('msgInput').addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
  document.getElementById('chatType').addEventListener('change', onTypeChange);
}

function loadData() {
  allUsers = JSON.parse(localStorage.getItem(LS.users) || '[]');
  allBranches = JSON.parse(localStorage.getItem(LS.branches) || '[]');
  chats = JSON.parse(localStorage.getItem(LS.chats) || '[]');
}

function getVisibleChats() {
  return chats.filter(c => {
    if (c.type === 'global') return true;
    if (c.type === 'branch') return c.branchId === currentUser.branchId;
    if (c.type === 'manual') {
      if (['owner','admin','helper'].includes(currentUser.role)) return true;
      return c.members && c.members.includes(currentUser.id);
    }
    return false;
  });
}

function renderChatList() {
  const list = document.getElementById('chatList');
  const visible = getVisibleChats();

  if (visible.length === 0) {
    list.innerHTML = '<div class="chat-item"><div class="chat-info"><div class="chat-name">Нет доступных чатов</div></div></div>';
    return;
  }

  list.innerHTML = visible.map(c => {
    const icon = c.type === 'global' ? '' : c.type === 'branch' ? '' : '💬';
    const msgs = c.messages || [];
    const last = msgs[msgs.length - 1];
    const preview = last ? last.text : 'Нет сообщений';
    return `
      <div class="chat-item ${c.id === activeChatId ? 'active' : ''}" data-id="${c.id}">
        <div class="chat-icon">${icon}</div>
        <div class="chat-info">
          <div class="chat-name">${c.name}</div>
          <div class="chat-preview">${preview.substring(0, 50)}</div>
        </div>
      </div>
    `;
  }).join('');

  list.querySelectorAll('.chat-item').forEach(el => {
    el.addEventListener('click', () => openChat(el.dataset.id));
  });
}

function openChat(id) {
  activeChatId = id;
  document.getElementById('noChat').style.display = 'none';
  document.getElementById('activeChat').style.display = 'flex';

  const c = chats.find(x => x.id === id);
  document.getElementById('activeName').textContent = c.name;
  document.getElementById('activeIcon').textContent = c.type === 'global' ? '🌐' : c.type === 'branch' ? '' : '💬';

  renderMessages();
  renderChatList();
}

function renderMessages() {
  const c = chats.find(x => x.id === activeChatId);
  const box = document.getElementById('messages');

  if (!c || !c.messages || c.messages.length === 0) {
    box.innerHTML = '<div style="text-align:center;color:#8696a0;padding:20px">Нет сообщений</div>';
    return;
  }

  box.innerHTML = c.messages.map(m => {
    const me = m.authorId === currentUser.id;
    return `
      <div class="msg ${me ? 'me' : 'other'}">
        ${!me ? '<div class="author">' + (m.authorName || '—') + '</div>' : ''}
        <div>${m.text}</div>
        <div class="time">${new Date(m.timestamp).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'})}</div>
      </div>
    `;
  }).join('');

  box.scrollTop = box.scrollHeight;
}

function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !activeChatId) return;

  const c = chats.find(x => x.id === activeChatId);
  if (!c.messages) c.messages = [];
  c.messages.push({
    id: 'm_' + Date.now(),
    authorId: currentUser.id,
    authorName: currentUser.name,
    text: text,
    timestamp: Date.now()
  });

  localStorage.setItem(LS.chats, JSON.stringify(chats));
  input.value = '';
  renderMessages();
  renderChatList();
}

function openModal() {
  document.getElementById('newChatModal').classList.add('active');
  document.getElementById('chatName').value = '';
  document.getElementById('chatType').value = 'manual';
  onTypeChange();
}

function closeModal() {
  document.getElementById('newChatModal').classList.remove('active');
}

function onTypeChange() {
  const type = document.getElementById('chatType').value;
  document.getElementById('branchBlock').style.display = type === 'branch' ? 'block' : 'none';
  document.getElementById('membersBlock').style.display = type === 'manual' ? 'block' : 'none';

  if (type === 'branch') {
    document.getElementById('chatBranch').innerHTML = allBranches.map(b => 
      '<option value="' + b.id + '">' + b.name + '</option>'
    ).join('');
  }

  if (type === 'manual') {
    document.getElementById('membersList').innerHTML = allUsers.map(u => `
      <label><input type="checkbox" value="${u.id}"><span>${u.name}</span></label>
    `).join('');
  }
}

function createChat() {
  const type = document.getElementById('chatType').value;
  const name = document.getElementById('chatName').value.trim();

  const chat = {
    id: 'c_' + Date.now(),
    type: type,
    name: name || (type === 'global' ? 'Общий чат' : type === 'branch' ? 'Чат отделения' : 'Новый чат'),
    branchId: null,
    members: [],
    createdBy: currentUser.id,
    createdAt: Date.now(),
    messages: []
  };

  if (type === 'branch') chat.branchId = document.getElementById('chatBranch').value;
  if (type === 'manual') {
    const checked = [...document.querySelectorAll('#membersList input:checked')].map(i => i.value);
    if (checked.length === 0) { alert('Выберите участников'); return; }
    chat.members = checked;
  }

  chats.push(chat);
  localStorage.setItem(LS.chats, JSON.stringify(chats));
  closeModal();
  renderChatList();
  openChat(chat.id);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
