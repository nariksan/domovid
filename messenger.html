<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2d8b4d">
<title>ДОМОВИД - Мессенджер</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; height: 100vh; overflow: hidden; }
.messenger-container { display: grid; grid-template-columns: 320px 1fr; height: 100vh; background: white; }
.chat-list { border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; background: #fafafa; }
.chat-list-header { padding: 12px 16px; background: #2d8b4d; color: white; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.chat-list-header h3 { font-size: 1.1em; flex: 1; }
.back-to-site { background: rgba(255,255,255,0.2); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85em; display: flex; align-items: center; gap: 4px; text-decoration: none; }
.back-to-site:hover { background: rgba(255,255,255,0.3); }
.new-chat-btn { padding: 8px 16px; background: white; color: #2d8b4d; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
.new-chat-btn:hover { background: #f0f0f0; }
.chat-search { padding: 12px; }
.chat-search input { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9em; }
.chats { flex: 1; overflow-y: auto; }
.chat-item { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #f0f0f0; transition: background 0.2s; display: flex; gap: 12px; align-items: center; }
.chat-item:hover { background: #f5f5f5; }
.chat-item.active { background: #e8f5e9; border-left: 3px solid #2d8b4d; }
.chat-item.unread { background: #e3f2fd; }
.chat-avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #2d8b4d, #e87722); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 1.2em; flex-shrink: 0; }
.chat-avatar.group { background: linear-gradient(135deg, #17a2b8, #667eea); }
.chat-info { flex: 1; min-width: 0; }
.chat-name { font-weight: 600; color: #333; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
.chat-time { font-size: 0.75em; color: #999; }
.chat-last-message { font-size: 0.85em; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-badge { background: #dc3545; color: white; padding: 2px 6px; border-radius: 10px; font-size: 0.7em; margin-left: 8px; }
.chat-window { display: flex; flex-direction: column; }
.chat-header { padding: 12px 16px; background: white; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; gap: 12px; }
.back-btn { display: none; background: none; border: none; font-size: 1.5em; cursor: pointer; color: #2d8b4d; margin-right: 8px; padding: 4px 8px; }
.chat-header-info { flex: 1; }
.chat-header-name { font-weight: 700; color: #333; }
.chat-header-status { font-size: 0.8em; color: #28a745; }
.messages { flex: 1; overflow-y: auto; padding: 16px; background: #f5f5f5; }
.message { margin-bottom: 16px; display: flex; gap: 8px; }
.message.own { flex-direction: row-reverse; }
.message-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #2d8b4d, #e87722); display: flex; align-items: center; justify-content: center; color: white; font-size: 0.9em; font-weight: 600; flex-shrink: 0; }
.message-content { max-width: 70%; }
.message-bubble { padding: 10px 14px; border-radius: 16px; background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
.message.own .message-bubble { background: #2d8b4d; color: white; }
.message-text { line-height: 1.4; word-break: break-word; }
.message-time { font-size: 0.75em; color: #999; margin-top: 4px; }
.message.own .message-time { color: rgba(255,255,255,0.8); text-align: right; }
.message-file { margin-top: 8px; padding: 8px; background: rgba(0,0,0,0.05); border-radius: 8px; display: flex; align-items: center; gap: 8px; font-size: 0.85em; }
.message.own .message-file { background: rgba(255,255,255,0.2); }
.message-input-area { padding: 16px; background: white; border-top: 1px solid #e0e0e0; display: flex; gap: 8px; align-items: center; }
.message-input { flex: 1; }
.message-input input { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 20px; font-size: 0.95em; }
.message-actions { display: flex; gap: 8px; }
.btn-icon { width: 40px; height: 40px; border: none; border-radius: 50%; background: #f5f5f5; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2em; transition: all 0.2s; }
.btn-icon:hover { background: #2d8b4d; color: white; }
.btn-send { background: #2d8b4d; color: white; }
.empty-chat { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #999; text-align: center; padding: 40px; }
.empty-chat-icon { font-size: 4em; margin-bottom: 16px; opacity: 0.5; }
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; padding: 16px; }
.modal.open { display: flex; }
.modal-content { background: white; border-radius: 12px; max-width: 500px; width: 100%; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
.modal-header { padding: 16px 18px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
.modal-header h3 { color: #2d8b4d; font-size: 1.1em; }
.modal-close { background: none; border: none; font-size: 1.6em; cursor: pointer; color: #999; }
.modal-body { padding: 18px; overflow-y: auto; flex: 1; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #333; font-size: 0.85em; }
.form-group input { width: 100%; padding: 10px 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 0.95em; }
.btn { padding: 10px 16px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 0.9em; }
.btn-primary { background: #2d8b4d; color: white; width: 100%; }
.btn-primary:hover { background: #236b3d; }
.maintenance-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, #dc3545 0%, #fd7e14 100%); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
.maintenance-content { background: white; border-radius: 16px; padding: 30px; max-width: 400px; text-align: center; }
.maintenance-icon { font-size: 4em; margin-bottom: 16px; }
.maintenance-title { color: #dc3545; font-size: 1.5em; margin-bottom: 12px; }
.maintenance-text { color: #666; margin-bottom: 20px; line-height: 1.5; }
@media (max-width: 768px) {
.messenger-container { grid-template-columns: 1fr; }
.chat-list { display: flex; }
.chat-list.hidden { display: none; }
.chat-window { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 10; display: none; background: white; }
.chat-window.active { display: flex; }
.back-btn { display: block; }
.message-content { max-width: 85%; }
.chat-list-header { flex-wrap: wrap; }
.back-to-site { order: 3; width: 100%; justify-content: center; margin-top: 8px; }
}
</style>
</head>
<body>
<div id="maintenanceOverlay" class="maintenance-overlay" style="display: none;">
<div class="maintenance-content">
<div class="maintenance-icon">🔧</div>
<div class="maintenance-title">Мессенджер на тех. работах</div>
<div class="maintenance-text">Владелец временно отключил мессенджер. Попробуйте позже.</div>
<a href="index.html" class="btn btn-primary">← Вернуться на сайт</a>
</div>
</div>
<div class="messenger-container" id="messengerContainer">
<div class="chat-list" id="chatList">
<div class="chat-list-header">
<h3>💬 Чаты</h3>
<button class="new-chat-btn" onclick="openNewChatModal()">➕ Новый</button>
<a href="index.html" class="back-to-site">← На сайт</a>
</div>
<div class="chat-search">
<input type="text" placeholder="🔍 Поиск чатов..." id="chatSearch" oninput="filterChats()">
</div>
<div class="chats" id="chatsList"></div>
</div>
<div class="chat-window" id="chatWindow">
<div class="empty-chat" id="emptyChat">
<div class="empty-chat-icon">💬</div>
<h3>Выберите чат</h3>
<p>Выберите чат из списка слева или создайте новый</p>
</div>
<div id="activeChat" style="display: none; height: 100%; flex-direction: column;">
<div class="chat-header">
<button class="back-btn" onclick="backToChatList()">←</button>
<div class="chat-avatar" id="chatAvatar">A</div>
<div class="chat-header-info">
<div class="chat-header-name" id="chatHeaderName">Имя чата</div>
<div class="chat-header-status" id="chatHeaderStatus"></div>
</div>
</div>
<div class="messages" id="messagesContainer"></div>
<div class="message-input-area">
<div class="message-input">
<input type="text" id="messageInput" placeholder="Введите сообщение..." onkeypress="handleMessageKeyPress(event)">
</div>
<div class="message-actions">
<button class="btn-icon" onclick="document.getElementById('fileInput').click()">📎</button>
<input type="file" id="fileInput" style="display: none;" onchange="handleFileSelect(event)">
<button class="btn-icon btn-send" onclick="sendMessage()">➤</button>
</div>
</div>
</div>
</div>
</div>
<div class="modal" id="newChatModal">
<div class="modal-content">
<div class="modal-header">
<h3>💬 Новый чат</h3>
<button class="modal-close" onclick="closeNewChatModal()">×</button>
</div>
<div class="modal-body">
<div class="form-group">
<label>Название чата</label>
<input type="text" id="newChatName" placeholder="Например: Отдел продаж">
</div>
<div class="form-group">
<label>Участники</label>
<div id="newChatParticipants" style="max-height: 200px; overflow-y: auto; border: 1px solid #ddd; border-radius: 8px; padding: 8px;"></div>
</div>
<button class="btn btn-primary" onclick="createNewChat()">Создать чат</button>
</div>
</div>
</div>
<script>
const firebaseConfig = {
apiKey: "AIzaSyDTHWwfpt059YCSt5YI9Aou1n1GjHxgQ6s",
authDomain: "domovidi.firebaseapp.com",
projectId: "domovidi",
storageBucket: "domovidi.firebasestorage.app",
messagingSenderId: "261930585857",
appId: "1:261930585857:web:856cf36981d8e0c2d51500"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();
let currentUser = null;
let chats = [];
let currentChatId = null;
let messagesUnsubscribe = null;
let selectedFileData = null;
const sessionStr = localStorage.getItem('domovidSession');
if (sessionStr) {
const session = JSON.parse(sessionStr);
db.collection('users').doc(session.id).get().then(async (doc) => {
if (doc.exists) {
const userData = doc.data();
currentUser = { id: session.id, name: userData.name, phone: userData.phone, role: userData.role, branchId: session.branchId || userData.branchId };
const messengerDoc = await db.collection('settings').doc('messenger').get();
if (messengerDoc.exists && messengerDoc.data().maintenanceMode && userData.role !== 'superadmin' && userData.role !== 'assistant') {
document.getElementById('maintenanceOverlay').style.display = 'flex';
document.getElementById('messengerContainer').style.display = 'none';
return;
}
cleanupOldMessages();
loadChats();
} else {
alert('Сессия истекла. Войдите через основной сайт.');
window.location.href = 'index.html';
}
}).catch(err => {
alert('Ошибка подключения: ' + err.message);
window.location.href = 'index.html';
});
} else {
alert('Войдите через основной сайт.');
window.location.href = 'index.html';
}
async function cleanupOldMessages() {
try {
const chatsSnap = await db.collection('chats').get();
const tenDaysAgo = Date.now() - (10 * 24 * 60 * 60 * 1000);
let totalDeleted = 0;
for (const chatDoc of chatsSnap.docs) {
const messagesQuery = db.collection(`chats/${chatDoc.id}/messages`).where('createdAt', '<', tenDaysAgo);
const messagesSnap = await messagesQuery.get();
for (const msgDoc of messagesSnap.docs) {
await msgDoc.ref.delete();
totalDeleted++;
}
}
if (totalDeleted > 0) console.log(`🧹 Удалено ${totalDeleted} старых сообщений`);
} catch (e) { console.error('Ошибка очистки:', e); }
}
async function loadChats() {
const chatsQuery = db.collection('chats').where('participants', 'array-contains', currentUser.id);
const chatsSnap = await chatsQuery.get();
chats = chatsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
chats.sort((a, b) => (b.lastMessageAt || 0) - (a.lastMessageAt || 0));
renderChatsList();
}
function renderChatsList() {
const container = document.getElementById('chatsList');
if (!container) return;
if (chats.length === 0) {
container.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">💬<br><br>Нет чатов<br><small>Создайте новый чат</small></div>';
return;
}
container.innerHTML = chats.map(chat => {
const isGroup = chat.isGroup || false;
const avatar = isGroup ? '👥' : (chat.participantName || '?')[0].toUpperCase();
const avatarClass = isGroup ? 'group' : '';
const name = isGroup ? chat.name : chat.participantName;
const unreadCount = chat.unreadCount || 0;
const lastMsg = chat.lastMessage || 'Нет сообщений';
const time = chat.lastMessageAt ? formatMessageTime(chat.lastMessageAt) : '';
return `<div class="chat-item ${currentChatId === chat.id ? 'active' : ''} ${unreadCount > 0 ? 'unread' : ''}" onclick="openChat('${chat.id}')">
<div class="chat-avatar ${avatarClass}">${avatar}</div>
<div class="chat-info">
<div class="chat-name">${escapeHtml(name)}${unreadCount > 0 ? `<span class="chat-badge">${unreadCount}</span>` : ''}</div>
<div class="chat-last-message">${escapeHtml(lastMsg)}</div>
<div class="chat-time">${time}</div>
</div>
</div>`;
}).join('');
}
function openChat(chatId) {
currentChatId = chatId;
const chat = chats.find(c => c.id === chatId);
if (!chat) return;
if (window.innerWidth <= 768) {
document.getElementById('chatList').classList.add('hidden');
document.getElementById('chatWindow').classList.add('active');
}
document.getElementById('emptyChat').style.display = 'none';
document.getElementById('activeChat').style.display = 'flex';
const isGroup = chat.isGroup || false;
const avatar = isGroup ? '👥' : (chat.participantName || '?')[0].toUpperCase();
document.getElementById('chatAvatar').textContent = avatar;
document.getElementById('chatHeaderName').textContent = isGroup ? chat.name : chat.participantName;
document.getElementById('chatHeaderStatus').textContent = isGroup ? `${chat.participantsCount || 0} участников` : 'Личный чат';
renderChatsList();
loadMessages(chatId);
}
function backToChatList() {
document.getElementById('chatList').classList.remove('hidden');
document.getElementById('chatWindow').classList.remove('active');
currentChatId = null;
if (messagesUnsubscribe) messagesUnsubscribe();
}
function loadMessages(chatId) {
if (messagesUnsubscribe) messagesUnsubscribe();
const messagesQuery = db.collection(`chats/${chatId}/messages`).orderBy('createdAt', 'asc').limit(50);
messagesUnsubscribe = messagesQuery.onSnapshot((snapshot) => {
const container = document.getElementById('messagesContainer');
if (!container) return;
const messages = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
container.innerHTML = messages.map(msg => {
const isOwn = msg.senderId === currentUser.id;
const sender = msg.senderName || 'Unknown';
const avatar = sender[0].toUpperCase();
return `<div class="message ${isOwn ? 'own' : ''}">
<div class="message-avatar">${avatar}</div>
<div class="message-content">
<div class="message-bubble">
${!isOwn && chats.find(c => c.id === chatId)?.isGroup ? `<div style="font-size:0.8em;margin-bottom:4px;opacity:0.8;">${escapeHtml(sender)}</div>` : ''}
<div class="message-text">${escapeHtml(msg.text || '')}</div>
${msg.fileUrl ? `<div class="message-file">📎 <a href="${msg.fileUrl}" target="_blank" style="color:inherit;text-decoration:underline;">${escapeHtml(msg.fileName || 'Файл')}</a></div>` : ''}
<div class="message-time">${formatMessageTime(msg.createdAt)}</div>
</div>
</div>
</div>`;
}).join('');
container.scrollTop = container.scrollHeight;
markMessagesAsRead(chatId);
});
}
async function markMessagesAsRead(chatId) {
const chat = chats.find(c => c.id === chatId);
if (!chat || chat.isGroup) return;
await db.collection(`chats/${chatId}/unread`).doc(currentUser.id).set({ count: 0 }, { merge: true });
}
async function sendMessage() {
const input = document.getElementById('messageInput');
const text = input.value.trim();
if (!text && !selectedFileData) return;
if (!currentChatId) return;
const messageData = { senderId: currentUser.id, senderName: currentUser.name, text: text, createdAt: Date.now(), read: false };
if (selectedFileData) {
try {
const fileRef = storage.ref(`chat_files/${currentChatId}/${Date.now()}_${selectedFileData.name}`);
await fileRef.put(selectedFileData.file);
messageData.fileUrl = await fileRef.getDownloadURL();
messageData.fileName = selectedFileData.name;
} catch (e) { alert('Ошибка загрузки файла: ' + e.message); return; }
}
await db.collection(`chats/${currentChatId}/messages`).add(messageData);
await db.collection('chats').doc(currentChatId).update({ lastMessage: text || '📄 Файл', lastMessageAt: Date.now() });
input.value = '';
selectedFileData = null;
if (messagesUnsubscribe) messagesUnsubscribe();
loadMessages(currentChatId);
loadChats();
}
function handleMessageKeyPress(event) { if (event.key === 'Enter') sendMessage(); }
function handleFileSelect(event) {
const file = event.target.files[0];
if (!file) return;
if (file.size > 5 * 1024 * 1024) { alert('Файл слишком большой! Максимум: 5 МБ'); return; }
selectedFileData = { file, name: file.name };
}
function openNewChatModal() {
const modal = document.getElementById('newChatModal');
const participantsContainer = document.getElementById('newChatParticipants');
db.collection('users').where('branchId', '==', currentUser.branchId).get().then(snap => {
participantsContainer.innerHTML = snap.docs.filter(doc => doc.id !== currentUser.id).map(doc => {
const emp = doc.data();
return `<label style="display:flex;align-items:center;gap:8px;padding:8px;cursor:pointer;">
<input type="checkbox" value="${doc.id}" data-name="${emp.name}">
<span>${emp.name}</span>
</label>`;
}).join('');
});
modal.classList.add('open');
}
function closeNewChatModal() { document.getElementById('newChatModal').classList.remove('open'); }
async function createNewChat() {
const name = document.getElementById('newChatName').value.trim();
const checkboxes = document.querySelectorAll('#newChatParticipants input[type="checkbox"]:checked');
if (!name) { alert('Введите название чата'); return; }
if (checkboxes.length === 0) { alert('Выберите хотя бы одного участника'); return; }
const participants = Array.from(checkboxes).map(cb => cb.value);
participants.push(currentUser.id);
const chatData = { name, isGroup: true, participants, participantsCount: participants.length, createdBy: currentUser.id, createdAt: Date.now(), lastMessage: '', lastMessageAt: 0 };
const chatRef = await db.collection('chats').add(chatData);
closeNewChatModal();
document.getElementById('newChatName').value = '';
await loadChats();
renderChatsList();
openChat(chatRef.id);
}
function filterChats() {
const search = document.getElementById('chatSearch').value.toLowerCase();
const items = document.querySelectorAll('.chat-item');
items.forEach(item => {
const name = item.querySelector('.chat-name').textContent.toLowerCase();
item.style.display = name.includes(search) ? 'flex' : 'none';
});
}
function formatMessageTime(timestamp) {
const date = new Date(timestamp);
const now = new Date();
const diff = now - date;
if (diff < 60000) return 'только что';
if (diff < 3600000) return `${Math.floor(diff / 60000)} мин назад`;
if (diff < 86400000) return `${Math.floor(diff / 3600000)} ч назад`;
return `${String(date.getDate()).padStart(2, '0')}.${String(date.getMonth() + 1).padStart(2, '0')} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
}
function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
window.addEventListener('resize', () => {
if (window.innerWidth > 768) {
document.getElementById('chatList').classList.remove('hidden');
document.getElementById('chatWindow').classList.remove('active');
} else if (currentChatId) {
document.getElementById('chatList').classList.add('hidden');
document.getElementById('chatWindow').classList.add('active');
}
});
</script>
</body>
</html>
