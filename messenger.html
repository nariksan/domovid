<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ДОМОВИД - Мессенджер</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0b141a;color:#e9edef;height:100vh;overflow:hidden}

/* Тех. работы */
.maintenance{display:none;position:fixed;inset:0;background:#0b141a;z-index:9999;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.maintenance.active{display:flex}
.maintenance h1{font-size:48px;margin-bottom:16px}
.maintenance h2{color:#f5c542;margin-bottom:12px}
.maintenance p{color:#8696a0;margin-bottom:24px;max-width:400px}
.maintenance a{color:#00a884;text-decoration:none}

/* Layout */
.app{display:flex;height:100vh}

/* Sidebar */
.sidebar{width:340px;min-width:280px;background:#111b21;border-right:1px solid #2a3942;
  display:flex;flex-direction:column}
.sidebar-head{padding:12px 16px;background:#202c33;display:flex;align-items:center;
  justify-content:space-between;gap:8px}
.sidebar-head a{color:#00a884;text-decoration:none;font-size:14px}
.sidebar-head h2{font-size:16px;flex:1;text-align:center}
.btn-new{background:#00a884;color:#fff;border:none;padding:8px 14px;border-radius:8px;
  cursor:pointer;font-size:14px}
.btn-new:hover{background:#06cf9c}

.chat-list{flex:1;overflow-y:auto}
.chat-item{padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;
  border-bottom:1px solid #2a3942;transition:background .15s}
.chat-item:hover,.chat-item.active{background:#2a3942}
.chat-icon{width:48px;height:48px;border-radius:50%;background:#2a3942;
  display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.chat-info{flex:1;min-width:0}
.chat-name{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-preview{font-size:13px;color:#8696a0;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:2px}
.chat-type{font-size:10px;padding:1px 6px;border-radius:4px;margin-left:6px;
  background:#2a3942;color:#8696a0}
.empty{text-align:center;padding:40px 20px;color:#8696a0}

/* Chat window */
.chat-window{flex:1;display:flex;flex-direction:column;background:#0b141a}
.chat-head{padding:12px 16px;background:#202c33;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid #2a3942}
.chat-head h3{font-size:16px}
.chat-head .sub{font-size:12px;color:#8696a0}

.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:8px;
  background-image:
    linear-gradient(rgba(11,20,26,.85),rgba(11,20,26,.85)),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><circle cx='20' cy='20' r='1' fill='%232a3942'/></svg>")}
.msg{max-width:65%;padding:8px 12px;border-radius:8px;word-wrap:break-word;position:relative}
.msg.me{background:#005c4b;align-self:flex-end}
.msg.other{background:#202c33;align-self:flex-start}
.msg .author{font-size:12px;color:#06cf9c;font-weight:600;margin-bottom:2px}
.msg .time{font-size:10px;color:#8696a0;margin-top:4px;text-align:right}

.input-bar{padding:12px 16px;background:#202c33;display:flex;gap:8px;align-items:center}
.input-bar input{flex:1;background:#2a3942;border:none;color:#e9edef;padding:10px 14px;
  border-radius:20px;font-size:14px;outline:none}
.input-bar button{background:#00a884;color:#fff;border:none;width:42px;height:42px;
  border-radius:50%;cursor:pointer;font-size:18px}
.input-bar button:hover{background:#06cf9c}

.no-chat{flex:1;display:flex;align-items:center;justify-content:center;
  flex-direction:column;color:#8696a0;gap:12px}
.no-chat .big{font-size:64px}

/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;
  align-items:center;justify-content:center}
.modal-bg.active{display:flex}
.modal{background:#202c33;border-radius:12px;padding:24px;width:90%;max-width:460px;
  max-height:90vh;overflow-y:auto}
.modal h3{margin-bottom:16px}
.modal label{display:block;margin:10px 0 6px;font-size:13px;color:#8696a0}
.modal input,.modal select,.modal textarea{width:100%;background:#2a3942;border:none;
  color:#e9edef;padding:10px;border-radius:6px;font-size:14px;outline:none}
.modal textarea{min-height:80px;resize:vertical}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.modal-actions button{padding:10px 16px;border:none;border-radius:6px;cursor:pointer;font-size:14px}
.btn-primary{background:#00a884;color:#fff}
.btn-primary:hover{background:#06cf9c}
.btn-secondary{background:#2a3942;color:#e9edef}
.members-list{max-height:200px;overflow-y:auto;background:#2a3942;border-radius:6px;padding:8px}
.members-list label{display:flex;align-items:center;gap:8px;padding:6px;margin:0;cursor:pointer}
.members-list label:hover{background:#0b141a;border-radius:4px}
</style>
</head>
<body>

<!-- Тех. работы -->
<div class="maintenance" id="maintenance">
  <h1>🔧</h1>
  <h2>Мессенджер на тех. работах</h2>
  <p>Владелец временно отключил мессенджер. Попробуйте позже.</p>
  <a href="index.html">← Вернуться на сайт</a>
</div>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <a href="index.html">← На сайт</a>
      <h2>💬 Чаты</h2>
      <button class="btn-new" id="btnNewChat" style="display:none">➕ Новый</button>
    </div>
    <div class="chat-list" id="chatList">
      <div class="empty">Загрузка чатов...</div>
    </div>
  </aside>

  <!-- Chat window -->
  <main class="chat-window" id="chatWindow">
    <div class="no-chat" id="noChat">
      <div class="big">💬</div>
      <h3>Выберите чат</h3>
      <p>Выберите чат из списка слева</p>
    </div>

    <div id="activeChat" style="display:none;flex:1;flex-direction:column;height:100%">
      <div class="chat-head">
        <div class="chat-icon" id="activeIcon">💬</div>
        <div>
          <h3 id="activeName">—</h3>
          <div class="sub" id="activeSub">—</div>
        </div>
      </div>
      <div class="messages" id="messages"></div>
      <div class="input-bar">
        <input type="text" id="msgInput" placeholder="Введите сообщение..." autocomplete="off">
        <button id="btnSend">➤</button>
      </div>
    </div>
  </main>
</div>

<!-- Модалка создания чата -->
<div class="modal-bg" id="newChatModal">
  <div class="modal">
    <h3>💬 Новый чат</h3>
    <label>Тип чата</label>
    <select id="ncType">
      <option value="manual">👥 Чат вручную</option>
      <option value="branch">🏪 Чат подразделения</option>
      <option value="global">🌐 Общий чат сети</option>
    </select>

    <label>Название чата</label>
    <input type="text" id="ncName" placeholder="Например: Продавцы">

    <div id="ncBranchBlock" style="display:none">
      <label>Отделение</label>
      <select id="ncBranch"></select>
    </div>

    <div id="ncMembersBlock">
      <label>Участники</label>
      <div class="members-list" id="ncMembers"></div>
    </div>

    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Отмена</button>
      <button class="btn-primary" onclick="createChat()">Создать чат</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   ДОМОВИД — Мессенджер
   Читает чаты из localStorage, фильтрует по текущему пользователю
   ========================================================= */

const LS = {
  user: 'currentUser',
  users: 'employees',      // список всех сотрудников (создаётся в index.html)
  branches: 'branches',    // список отделений
  chats: 'chats',          // список чатов
  enabled: 'messengerEnabled'
};

let currentUser = null;
let allUsers = [];
let allBranches = [];
let chats = [];
let activeChatId = null;

/* ---------- Инициализация ---------- */
function init() {
  // 1. Проверка текущего пользователя
  const raw = localStorage.getItem(LS.user);
  if (!raw) {
    alert('Сначала войдите в систему на главной странице.');
    location.href = 'index.html';
    return;
  }
  currentUser = JSON.parse(raw);

  // 2. Проверка тех. работ
  const enabled = localStorage.getItem(LS.enabled);
  if (enabled === 'false') {
    document.getElementById('maintenance').classList.add('active');
    return;
  }

  // 3. Загружаем данные
  loadData();

  // 4. Показываем кнопку "Новый чат" только владельцу/админу/помощнику
  const canCreate = ['owner','admin','helper'].includes(currentUser.role);
  document.getElementById('btnNewChat').style.display = canCreate ? 'inline-block' : 'none';

  // 5. Рендерим список чатов
  renderChatList();

  // 6. Автообновление (чтобы видеть новые сообщения/чаты из index.html)
  setInterval(() => {
    loadData();
    renderChatList();
    if (activeChatId) renderMessages();
  }, 2000);

  // 7. Обновление при изменении localStorage в другой вкладке
  window.addEventListener('storage', () => {
    loadData();
    renderChatList();
    if (activeChatId) renderMessages();
  });

  // 8. Обработчики
  document.getElementById('btnNewChat').addEventListener('click', openNewChatModal);
  document.getElementById('btnSend').addEventListener('click', sendMessage);
  document.getElementById('msgInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') sendMessage();
  });
  document.getElementById('ncType').addEventListener('change', onTypeChange);
}

function loadData() {
  allUsers = JSON.parse(localStorage.getItem(LS.users) || '[]');
  allBranches = JSON.parse(localStorage.getItem(LS.branches) || '[]');
  chats = JSON.parse(localStorage.getItem(LS.chats) || '[]');
}

/* ---------- Фильтрация чатов по правам ---------- */
function getVisibleChats() {
  return chats.filter(c => {
    if (c.type === 'global') return true;
    if (c.type === 'branch') return c.branchId === currentUser.branchId;
    if (c.type === 'manual') {
      // Владелец/админ/помощник видит все ручные чаты (для управления)
      if (['owner','admin','helper'].includes(currentUser.role)) return true;
      return Array.isArray(c.members) && c.members.includes(currentUser.id);
    }
    return false;
  });
}

/* ---------- Рендер списка чатов ---------- */
function renderChatList() {
  const list = document.getElementById('chatList');
  const visible = getVisibleChats();

  if (visible.length === 0) {
    list.innerHTML = '<div class="empty">Пока нет доступных чатов.<br>Попросите владельца создать чат.</div>';
    return;
  }

  list.innerHTML = visible.map(c => {
    const icon = c.type === 'global' ? '🌐' : c.type === 'branch' ? '🏪' : '💬';
    const msgs = c.messages || [];
    const last = msgs[msgs.length - 1];
    const preview = last ? `${last.text}` : 'Нет сообщений';
    const typeLabel = c.type === 'global' ? 'сеть' : c.type === 'branch' ? 'отделение' : 'вручную';
    return `
      <div class="chat-item ${c.id === activeChatId ? 'active' : ''}" data-id="${c.id}">
        <div class="chat-icon">${icon}</div>
        <div class="chat-info">
          <div class="chat-name">${escapeHtml(c.name || 'Без названия')}<span class="chat-type">${typeLabel}</span></div>
          <div class="chat-preview">${escapeHtml(preview.slice(0, 60))}</div>
        </div>
      </div>
    `;
  }).join('');

  list.querySelectorAll('.chat-item').forEach(el => {
    el.addEventListener('click', () => openChat(el.dataset.id));
  });
}

/* ---------- Открытие чата ---------- */
function openChat(id) {
  activeChatId = id;
  document.getElementById('noChat').style.display = 'none';
  const ac = document.getElementById('activeChat');
  ac.style.display = 'flex';

  const c = chats.find(x => x.id === id);
  if (!c) return;

  document.getElementById('activeIcon').textContent =
    c.type === 'global' ? '🌐' : c.type === 'branch' ? '🏪' : '💬';
  document.getElementById('activeName').textContent = c.name || 'Чат';

  let sub = '';
  if (c.type === 'global') sub = 'Общий чат сети';
  else if (c.type === 'branch') {
    const b = allBranches.find(x => x.id === c.branchId);
    sub = 'Отделение: ' + (b ? b.name : '—');
  } else {
    sub = 'Участников: ' + (c.members?.length || 0);
  }
  document.getElementById('activeSub').textContent = sub;

  renderMessages();
  renderChatList(); // подсветить активный
}

/* ---------- Рендер сообщений ---------- */
function renderMessages() {
  const c = chats.find(x => x.id === activeChatId);
  const box = document.getElementById('messages');
  if (!c) { box.innerHTML = ''; return; }

  const msgs = c.messages || [];
  if (msgs.length === 0) {
    box.innerHTML = '<div class="empty">Сообщений пока нет. Напишите первым!</div>';
    return;
  }

  box.innerHTML = msgs.map(m => {
    const me = m.authorId === currentUser.id;
    const authorName = m.authorName || '—';
    return `
      <div class="msg ${me ? 'me' : 'other'}">
        ${!me ? `<div class="author">${escapeHtml(authorName)}</div>` : ''}
        <div>${escapeHtml(m.text)}</div>
        <div class="time">${formatTime(m.timestamp)}</div>
      </div>
    `;
  }).join('');

  box.scrollTop = box.scrollHeight;
}

/* ---------- Отправка сообщения ---------- */
function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !activeChatId) return;

  const c = chats.find(x => x.id === activeChatId);
  if (!c) return;

  if (!c.messages) c.messages = [];
  c.messages.push({
    id: 'm_' + Date.now(),
    authorId: currentUser.id,
    authorName: currentUser.name || 'Пользователь',
    text: text,
    timestamp: Date.now()
  });

  // Сохраняем обратно в localStorage
  saveChats();
  input.value = '';
  renderMessages();
  renderChatList();
}

function saveChats() {
  localStorage.setItem(LS.chats, JSON.stringify(chats));
}

/* ---------- Создание нового чата ---------- */
function openNewChatModal() {
  document.getElementById('newChatModal').classList.add('active');
  document.getElementById('ncName').value = '';
  document.getElementById('ncType').value = 'manual';
  onTypeChange();
  fillBranches();
  fillMembers();
}

function closeModal() {
  document.getElementById('newChatModal').classList.remove('active');
}

function onTypeChange() {
  const t = document.getElementById('ncType').value;
  document.getElementById('ncBranchBlock').style.display = t === 'branch' ? 'block' : 'none';
  document.getElementById('ncMembersBlock').style.display = t === 'manual' ? 'block' : 'none';
}

function fillBranches() {
  const sel = document.getElementById('ncBranch');
  sel.innerHTML = allBranches.map(b =>
    `<option value="${b.id}">${escapeHtml(b.name)}</option>`
  ).join('');
}

function fillMembers() {
  const box = document.getElementById('ncMembers');
  if (allUsers.length === 0) {
    box.innerHTML = '<div class="empty">Нет сотрудников</div>';
    return;
  }
  box.innerHTML = allUsers.map(u => `
    <label>
      <input type="checkbox" value="${u.id}">
      <span>${escapeHtml(u.name || '—')}</span>
      <span style="color:#8696a0;font-size:12px">(${escapeHtml(u.position || '')})</span>
    </label>
  `).join('');
}

function createChat() {
  const type = document.getElementById('ncType').value;
  const name = document.getElementById('ncName').value.trim();

  const chat = {
    id: 'c_' + Date.now(),
    type: type,
    name: name || (type === 'global' ? 'Общий чат' : type === 'branch' ? 'Чат отделения' : 'Новый чат'),
    branchId: null,
    members: [],
    createdBy: currentUser.id,
    createdAt: Date.now(),
    messages: []
  };

  if (type === 'branch') {
    chat.branchId = document.getElementById('ncBranch').value;
    if (!chat.branchId) { alert('Выберите отделение'); return; }
  }
  if (type === 'manual') {
    const checked = [...document.querySelectorAll('#ncMembers input:checked')].map(i => i.value);
    if (checked.length === 0) { alert('Выберите хотя бы одного участника'); return; }
    chat.members = checked;
  }

  chats.push(chat);
  saveChats();
  closeModal();
  renderChatList();
  openChat(chat.id);
}

/* ---------- Утилиты ---------- */
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}
function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
}

/* ---------- Старт ---------- */
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
