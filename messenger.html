<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ДОМОВИД</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0b141a;color:#e9edef;min-height:100vh}
.container{max-width:1200px;margin:0 auto;padding:20px}

/* Login */
.login-box{max-width:400px;margin:100px auto;background:#202c33;padding:30px;border-radius:12px}
.login-box h1{text-align:center;margin-bottom:30px;color:#00a884}
.form-group{margin-bottom:20px}
.form-group label{display:block;margin-bottom:8px;color:#8696a0}
.form-group input,.form-group select{width:100%;padding:12px;background:#2a3942;border:none;border-radius:6px;color:#e9edef;font-size:14px}
.btn{width:100%;padding:12px;background:#00a884;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:16px}
.btn:hover{background:#06cf9c}
.error{color:#f5c542;margin-top:10px;text-align:center}

/* Header */
.header{background:#202c33;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;border-radius:8px}
.header h2{color:#00a884}
.user-info{display:flex;align-items:center;gap:15px}
.btn-logout{background:#2a3942;color:#e9edef;padding:8px 16px;border:none;border-radius:6px;cursor:pointer}

/* Navigation */
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.nav-btn{background:#2a3942;color:#e9edef;padding:10px 16px;border:none;border-radius:6px;cursor:pointer}
.nav-btn:hover,.nav-btn.active{background:#00a884}

/* Sections */
.section{display:none;background:#202c33;padding:20px;border-radius:8px}
.section.active{display:block}
.section h3{margin-bottom:20px;color:#00a884}

/* Owner Panel */
.owner-panel{background:#1a252a;padding:20px;border-radius:8px;margin-bottom:20px}
.toggle{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.toggle input{width:20px;height:20px}
.chat-list-admin{background:#2a3942;padding:15px;border-radius:6px}
.chat-item-admin{padding:10px;border-bottom:1px solid #202c33;display:flex;justify-content:space-between;align-items:center}
.chat-item-admin:last-child{border:none}
.btn-small{padding:6px 12px;font-size:12px}

/* Modal */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;align-items:center;justify-content:center}
.modal.active{display:flex}
.modal-content{background:#202c33;padding:24px;border-radius:12px;max-width:500px;width:90%}
.modal-content h3{margin-bottom:16px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
</style>
</head>
<body>

<!-- LOGIN FORM -->
<div id="loginSection" class="login-box">
  <h1>🏠 ДОМОВИД</h1>
  <div class="form-group">
    <label> Выберите отделение</label>
    <select id="loginBranch">
      <option value="">Загрузка...</option>
    </select>
  </div>
  <div class="form-group">
    <label>📱 Телефон</label>
    <input type="tel" id="loginPhone" placeholder="+7 (___) ___-__-__">
  </div>
  <div class="form-group">
    <label>🔒 Пароль</label>
    <input type="password" id="loginPassword" placeholder="••••••••">
  </div>
  <button class="btn" onclick="login()">Войти</button>
  <div id="loginError" class="error"></div>
</div>

<!-- MAIN APP (скрыт до входа) -->
<div id="mainApp" style="display:none">
  <div class="container">
    <div class="header">
      <h2>🏠 ДОМОВИД</h2>
      <div class="user-info">
        <span id="userName">—</span>
        <button class="btn-logout" onclick="logout()">🚪 Выйти</button>
      </div>
    </div>

    <div class="nav">
      <button class="nav-btn active" onclick="showSection('schedule')">📅 График</button>
      <button class="nav-btn" onclick="showSection('plan')">📈 План</button>
      <button class="nav-btn" onclick="openMessenger()">💬 Мессенджер</button>
      <button class="nav-btn" id="ownerBtn" style="display:none" onclick="showSection('owner')">👑 Владелец</button>
    </div>

    <!-- OWNER SECTION -->
    <div id="ownerSection" class="section">
      <h3>👑 Панель Владельца</h3>
      
      <div class="owner-panel">
        <h4>💬 Управление мессенджером</h4>
        <div class="toggle">
          <input type="checkbox" id="messengerToggle" checked onchange="toggleMessenger()">
          <label for="messengerToggle">✅ Мессенджер работает</label>
        </div>
        
        <div style="display:flex;gap:10px;margin:15px 0;flex-wrap:wrap">
          <button class="nav-btn" onclick="openModal('branchChatModal')">🏪 Чат подразделения</button>
          <button class="nav-btn" onclick="openModal('globalChatModal')">🌐 Общий чат сети</button>
          <button class="nav-btn" onclick="openModal('manualChatModal')">👥 Чат вручную</button>
        </div>

        <div class="chat-list-admin">
          <h4>📋 Существующие чаты</h4>
          <div id="adminChatList">Загрузка...</div>
        </div>
      </div>
    </div>

    <!-- SCHEDULE SECTION -->
    <div id="scheduleSection" class="section active">
      <h3> График работы</h3>
      <p>Раздел в разработке...</p>
    </div>

    <!-- PLAN SECTION -->
    <div id="planSection" class="section">
      <h3>📈 План</h3>
      <p>Раздел в разработке...</p>
    </div>
  </div>
</div>

<!-- MODALS FOR CREATING CHATS -->
<div id="branchChatModal" class="modal">
  <div class="modal-content">
    <h3> Создать чат подразделения</h3>
    <div class="form-group">
      <label>Выберите отделение:</label>
      <select id="branchChatBranch"></select>
    </div>
    <div class="form-group">
      <label>Название чата (необязательно):</label>
      <input type="text" id="branchChatName" placeholder="Например: Продавцы">
    </div>
    <div class="modal-actions">
      <button class="nav-btn" onclick="closeModal('branchChatModal')">Отмена</button>
      <button class="nav-btn" style="background:#00a884" onclick="createBranchChat()">Создать</button>
    </div>
  </div>
</div>

<div id="globalChatModal" class="modal">
  <div class="modal-content">
    <h3>🌐 Создать общий чат сети</h3>
    <div class="form-group">
      <label>Название общего чата:</label>
      <input type="text" id="globalChatName" placeholder="Например: Общие новости">
    </div>
    <div class="modal-actions">
      <button class="nav-btn" onclick="closeModal('globalChatModal')">Отмена</button>
      <button class="nav-btn" style="background:#00a884" onclick="createGlobalChat()">Создать</button>
    </div>
  </div>
</div>

<div id="manualChatModal" class="modal">
  <div class="modal-content">
    <h3> Создать чат вручную</h3>
    <div class="form-group">
      <label>Название чата:</label>
      <input type="text" id="manualChatName" placeholder="Название">
    </div>
    <div class="form-group">
      <label>Выберите участников:</label>
      <div id="manualChatMembers" style="max-height:200px;overflow-y:auto;background:#2a3942;padding:10px;border-radius:6px"></div>
    </div>
    <div class="modal-actions">
      <button class="nav-btn" onclick="closeModal('manualChatModal')">Отмена</button>
      <button class="nav-btn" style="background:#00a884" onclick="createManualChat()">Создать</button>
    </div>
  </div>
</div>

<script>
// localStorage keys
const LS = {
  users: 'employees',
  branches: 'branches',
  chats: 'chats',
  currentUser: 'currentUser',
  messengerEnabled: 'messengerEnabled'
};

let currentUser = null;
let allUsers = [];
let allBranches = [];
let chats = [];

/* ========== INITIALIZATION ========== */
function init() {
  loadData();
  
  // If no branches, create demo data
  if (allBranches.length === 0) {
    createDemoData();
  }
  
  // Check if user already logged in
  const saved = localStorage.getItem(LS.currentUser);
  if (saved) {
    currentUser = JSON.parse(saved);
    showMainApp();
  } else {
    showLogin();
  }
}

function createDemoData() {
  // Create demo branches
  allBranches = [
    {id: 'b1', name: 'Главный офис', city: 'Москва'},
    {id: 'b2', name: 'Филиал №1', city: 'Санкт-Петербург'}
  ];
  
  // Create demo users
  allUsers = [
    {id: 'u1', name: 'Владелец', phone: '999', password: '123', role: 'owner', branchId: 'b1', position: 'Директор'},
    {id: 'u2', name: 'Админ', phone: '998', password: '123', role: 'admin', branchId: 'b1', position: 'Администратор'},
    {id: 'u3', name: 'Продавец 1', phone: '997', password: '123', role: 'employee', branchId: 'b1', position: 'Продавец'},
    {id: 'u4', name: 'Продавец 2', phone: '996', password: '123', role: 'employee', branchId: 'b2', position: 'Продавец'}
  ];
  
  saveData();
  
  // Enable messenger by default
  localStorage.setItem(LS.messengerEnabled, 'true');
}

function loadData() {
  allBranches = JSON.parse(localStorage.getItem(LS.branches) || '[]');
  allUsers = JSON.parse(localStorage.getItem(LS.users) || '[]');
  chats = JSON.parse(localStorage.getItem(LS.chats) || '[]');
}

function saveData() {
  localStorage.setItem(LS.branches, JSON.stringify(allBranches));
  localStorage.setItem(LS.users, JSON.stringify(allUsers));
  localStorage.setItem(LS.chats, JSON.stringify(chats));
}

/* ========== LOGIN ========== */
function showLogin() {
  document.getElementById('loginSection').style.display = 'block';
  document.getElementById('mainApp').style.display = 'none';
  
  // Fill branches
  const sel = document.getElementById('loginBranch');
  if (allBranches.length > 0) {
    sel.innerHTML = allBranches.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
  } else {
    sel.innerHTML = '<option value="">Нет отделений</option>';
  }
}

function showMainApp() {
  document.getElementById('loginSection').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  document.getElementById('userName').textContent = `${currentUser.name} (${currentUser.position})`;
  
  // Show owner panel only for owner/admin/helper
  const canOwner = ['owner','admin','helper'].includes(currentUser.role);
  document.getElementById('ownerBtn').style.display = canOwner ? 'inline-block' : 'none';
  
  if (canOwner) {
    loadOwnerPanel();
  }
}

function login() {
  const branchId = document.getElementById('loginBranch').value;
  const phone = document.getElementById('loginPhone').value.trim();
  const password = document.getElementById('loginPassword').value;
  
  if (!branchId || !phone || !password) {
    document.getElementById('loginError').textContent = 'Заполните все поля';
    return;
  }
  
  // Find user
  const user = allUsers.find(u => u.phone === phone && u.password === password && u.branchId === branchId);
  
  if (!user) {
    document.getElementById('loginError').textContent = 'Неверный телефон, пароль или отделение';
    return;
  }
  
  // Login success
  currentUser = user;
  localStorage.setItem(LS.currentUser, JSON.stringify(user));
  document.getElementById('loginError').textContent = '';
  showMainApp();
}

function logout() {
  localStorage.removeItem(LS.currentUser);
  currentUser = null;
  showLogin();
}

/* ========== SECTIONS ========== */
function showSection(name) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  
  document.getElementById(name + 'Section').classList.add('active');
  event.target.classList.add('active');
}

function openMessenger() {
  window.location.href = 'messenger.html';
}

/* ========== OWNER PANEL ========== */
function loadOwnerPanel() {
  // Messenger toggle
  const enabled = localStorage.getItem(LS.messengerEnabled) !== 'false';
  document.getElementById('messengerToggle').checked = enabled;
  
  // Load chat list
  renderAdminChatList();
}

function toggleMessenger() {
  const enabled = document.getElementById('messengerToggle').checked;
  localStorage.setItem(LS.messengerEnabled, enabled ? 'true' : 'false');
}

function renderAdminChatList() {
  const div = document.getElementById('adminChatList');
  if (chats.length === 0) {
    div.innerHTML = '<p style="color:#8696a0">Чатов пока нет</p>';
    return;
  }
  
  div.innerHTML = chats.map(c => {
    const typeLabel = c.type === 'global' ? '🌐 Сеть' : c.type === 'branch' ? '🏪 Отделение' : '👥 Ручной';
    return `
      <div class="chat-item-admin">
        <span>${typeLabel} — ${c.name || 'Без названия'}</span>
        <button class="nav-btn btn-small" onclick="deleteChat('${c.id}')">🗑️</button>
      </div>
    `;
  }).join('');
}

function deleteChat(id) {
  if (!confirm('Удалить этот чат?')) return;
  chats = chats.filter(c => c.id !== id);
  saveData();
  renderAdminChatList();
}

/* ========== CREATE CHATS ========== */
function openModal(id) {
  document.getElementById(id).classList.add('active');
  
  if (id === 'branchChatModal') {
    const sel = document.getElementById('branchChatBranch');
    sel.innerHTML = allBranches.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
  }
  
  if (id === 'manualChatModal') {
    const div = document.getElementById('manualChatMembers');
    div.innerHTML = allUsers.map(u => `
      <label style="display:block;padding:5px;cursor:pointer">
        <input type="checkbox" value="${u.id}"> ${u.name} (${u.position})
      </label>
    `).join('');
  }
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

function createBranchChat() {
  const branchId = document.getElementById('branchChatBranch').value;
  const name = document.getElementById('branchChatName').value.trim();
  
  const chat = {
    id: 'c_' + Date.now(),
    type: 'branch',
    name: name || 'Чат подразделения',
    branchId: branchId,
    members: [],
    createdBy: currentUser.id,
    createdAt: Date.now(),
    messages: []
  };
  
  chats.push(chat);
  saveData();
  closeModal('branchChatModal');
  renderAdminChatList();
  alert('Чат создан!');
}

function createGlobalChat() {
  const name = document.getElementById('globalChatName').value.trim();
  
  const chat = {
    id: 'c_' + Date.now(),
    type: 'global',
    name: name || 'Общий чат',
    branchId: null,
    members: [],
    createdBy: currentUser.id,
    createdAt: Date.now(),
    messages: []
  };
  
  chats.push(chat);
  saveData();
  closeModal('globalChatModal');
  renderAdminChatList();
  alert('Чат создан!');
}

function createManualChat() {
  const name = document.getElementById('manualChatName').value.trim();
  const checked = [...document.querySelectorAll('#manualChatMembers input:checked')].map(i => i.value);
  
  if (checked.length === 0) {
    alert('Выберите хотя бы одного участника');
    return;
  }
  
  const chat = {
    id: 'c_' + Date.now(),
    type: 'manual',
    name: name || 'Новый чат',
    branchId: null,
    members: checked,
    createdBy: currentUser.id,
    createdAt: Date.now(),
    messages: []
  };
  
  chats.push(chat);
  saveData();
  closeModal('manualChatModal');
  renderAdminChatList();
  alert('Чат создан!');
}

/* ========== START ========== */
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
